name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build WorkflowRecorder.slnx -c Release
      - name: Smoke test
        run: dotnet run --project tests/WorkflowRecorder.SmokeTests -c Release --no-build
